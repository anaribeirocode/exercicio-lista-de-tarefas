<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A melhor Lista de Tarefas</title>
    <link rel="shortcut icon" href="/img/bbd1fdb6-3010-415c-871d-283490a14bdc.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>MINHA LISTA DE TAREFAS</h1>
        <div class="input-group">
            <input type="text" id="nova-tarefa" placeholder="Digite uma nova tarefa">
            <button id="adicionar">Adicionar</button>
        </div>
        <ul id="lista-tarefas"></ul>
        <p id="mensagem-vazia">Nenhuma tarefa ainda!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
